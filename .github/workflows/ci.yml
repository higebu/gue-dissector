name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # StyLua has no usable uv/pip path (its release-gitter build backend
      # fails under uv), so use the upstream action, which fetches the release
      # binary.
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  python-lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Dissection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tshark
        run: |
          echo 'wireshark-common wireshark-common/install-setuid boolean false' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark

      # The tests skip themselves without Lua, which would let a broken
      # runner pass silently.  Fail here instead.
      - name: Check tshark has Lua support
        run: tshark -v | grep -q 'with Lua'

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: uv run pytest -v
