name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to resolve the range of commits under review.
          fetch-depth: 0

      # Done against local git rather than with the commitlint action, which
      # asks the compare API for the push range and so fails outright once a
      # force-push leaves no common ancestor.
      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
              from="$BASE"
          elif [ -n "$BEFORE" ] && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
              from="$BEFORE"
          else
              # New branch, or a force-push that rewrote history: the range is
              # meaningless, so check the head commit alone.
              from="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "Linting ${from:-<root>}..HEAD"

      - name: Lint commit messages
        run: |
          npx --yes \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint --from "${{ steps.range.outputs.from }}" --to HEAD --verbose

  lua-format:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # StyLua has no usable uv/pip path (its release-gitter build backend
      # fails under uv), so use the upstream action, which fetches the release
      # binary.
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  python-lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Dissection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tshark
        run: |
          echo 'wireshark-common wireshark-common/install-setuid boolean false' \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark

      # The tests skip themselves without Lua, which would let a broken
      # runner pass silently.  Fail here instead.
      - name: Check tshark has Lua support
        run: tshark -v | grep -q 'with Lua'

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv run pytest -v
